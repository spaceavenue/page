[package]
name = "page"
description = "A rusty terminal pager."
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["spaceavenue <spaceavenue@proton.me>"]
repository = "https://github.com/spaceavenue/page-rs"

[dependencies]
anyhow = { version = "1.0.104", default-features = false }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
memchr = { version = "2.8.3" }
memmap2 = { version = "0.9.11", default-features = false }
unicode-segmentation = { version = "1.13.3", default-features = false }
unicode-width = { version = "0.2.2", default-features = false, features = ["cjk"] }

[dependencies.clap]
version = "4.6.7"
default-features = false
features = ["std", "derive", "help", "usage", "error-context"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# no panic
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
# might panic
indexing_slicing = "deny"
unchecked_time_subtraction = "deny"
string_slice = "deny"
#numbers
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
# "idiomatic"
cloned_instead_of_copied = "warn"
redundant_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
